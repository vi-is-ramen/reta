name: Feature Request
description: Suggest a new useful macro, branching feature, or API change
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: |
              A clear and concise description of what the problem is. Ex.
              "I'm always frustrated when I need to change visibility
              conditionally but Reta doesn't have this functionality..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: |
          A clear and concise description of what you want to happen. How
          would this fit into the existing API?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: |
              A clear and concise description of any alternative solutions
              or features you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
              Add any other context, benchmarks, or academic papers about
              the feature you've requested here.
